name: Bug report
description: 不具合を報告し、修正を 1 Issue = 1 branch = 1 Draft PR で行う
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        作成前にリポジトリ直下の `CONTRIBUTING.md` を確認してください。
        ログやスクリーンショットを貼る場合は、camera serial、credential、実撮影画像を含めないでください。カメラ識別子は redacted alias（`CAM-A` など）に置き換えます。
  - type: textarea
    id: purpose
    attributes:
      label: 目的と現在地
      description: 症状と、それが何を壊しているか。既知の回避策があれば書く。
      placeholder: |
        （何が起きるか）。そのため（何ができないか）。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順と期待結果
      description: 実行したコマンド、期待した結果、実際の結果。再現しない場合はその条件も書く。
      value: |
        実行:

        ```powershell

        ```

        期待:

        実際:
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 対象範囲
      description: この Issue で修正するもの。
      value: |
        -
        -
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 対象外
      description: 同じ場所で見つかったが、別 Issue へ回すもの。「ついでに直す」を防ぐために書く。
      value: |
        -
        -
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: 所有領域
      description: この Issue だけが変更するファイル・ディレクトリ。他 Issue が所有する shared file は同時編集しない。
      placeholder: |
        この Issue だけが `src/m3/OperatorShell/ViewModels/**` を変更します。`.github/workflows/**` と `docs/**` は変更しません。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依存関係
      description: 先に閉じる必要がある Issue、待っている human gate。なければ「なし」と書く。
      placeholder: |
        なし。作業開始時点の最新 `codex/main-feature-integration` から開始します。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 症状が解消したことを、どう観測して確認するか。回帰テストの追加もここに書く。
      value: |
        - [ ]
        - [ ] 同じ症状を再現する回帰テストを追加し、修正前に落ちて修正後に通ることを確認した
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 必須検証
      description: 実行する試験と期待結果。既存テストの期待値を弱めて通すことは認めない。
      value: |
        - [ ] `pwsh -File .\scripts\Test-M3Simulated.ps1 -Configuration Release`
        - [ ] `git diff --check`
        - [ ] serial / credential / SDK 配布物 / licensed binary / 実画像を含まないことの確認
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 実行環境
      description: 修正の検証に実 D810 への command が必要かどうか。`hardware-required` は human gate 必須。
      options:
        - software-only
        - hardware-required
    validations:
      required: true
  - type: dropdown
    id: safety_class
    attributes:
      label: 安全境界クラス
      options:
        - "S1 — software-only または read-only"
        - "S2 — 明示 gate と evidence を伴う実機操作"
        - "S3 — release または破壊的リスクの決定 gate"
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 安全境界
      description: 触らないものを明記する。camera command、SDK/WPD session、実機、既存 evidence、licensed 資材のどれに触れないか。
      placeholder: |
        software contract だけを変更し、camera command、SDK/WPD、実機、既存 evidence へアクセスしません。
    validations:
      required: true
  - type: textarea
    id: branch
    attributes:
      label: Branch / PR
      value: |
        - branch: `codex/issue-<number>-<slug>`
        - Draft PR base: `codex/main-feature-integration`
        - merge と push は Sol のみ
    validations:
      required: true
  - type: textarea
    id: traceability
    attributes:
      label: Traceability
      description: 要件 ID は `.autodev/requirements/normalized.json`、version は `.autodev/plan.json` に合わせる。
      value: |
        ```yaml
        ar_key: AR-XX
        dedupe_key:
        safety_class: S1
        environment: software-only
        human_gate: false
        plan_version: 2.10.0
        requirements_version: 2.7.0
        requirements:
          -
        ```
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: 参加ルールの確認
      options:
        - label: 1 Issue = 1 branch = 原則 1 Draft PR、base は `codex/main-feature-integration` にする
          required: true
        - label: 所有領域の外にある shared file を同時編集しない。必要になったら編集せず Issue へ記録する
          required: true
        - label: 修正 loop は原則 1 回にまとめる
          required: true
        - label: 実機操作・外部公開・破壊的操作は `human-gate` を付けて停止する
          required: true
        - label: serial、credential、SDK 配布物、licensed binary、実画像をコミットしない
          required: true
        - label: .NET テストを追加／削除する場合は `scripts/Test-M3Simulated.ps1` の期待件数を同じ PR で更新する
          required: true
