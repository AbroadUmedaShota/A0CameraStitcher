<svg xmlns="http://www.w3.org/2000/svg" width="841mm" height="1189mm" viewBox="0 0 841 1189" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic A0 calibration chart</title>
  <desc id="desc">Rights-cleared synthetic A0 chart with grid, fiducials, grayscale and colour patches, and coordinate labels.</desc>
  <defs>
    <pattern id="minorGrid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="#d0d0d0" stroke-width="0.25"/></pattern>
    <pattern id="majorGrid" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#minorGrid)"/><path d="M 50 0 L 0 0 0 50" fill="none" stroke="#808080" stroke-width="0.6"/></pattern>
    <g id="fiducial"><circle r="16" fill="white" stroke="black" stroke-width="1.2"/><circle r="10" fill="black"/><circle r="5" fill="white"/><path d="M-22 0H22M0-22V22" stroke="black" stroke-width="0.8"/></g>
  </defs>
  <rect width="841" height="1189" fill="white"/>
  <rect x="20" y="20" width="801" height="1149" fill="url(#majorGrid)" stroke="black" stroke-width="1.5"/>
  <text x="30" y="43" font-family="Arial, sans-serif" font-size="10" font-weight="bold">A0 SYNTHETIC CALIBRATION CHART — NOT A QUALITY RESULT</text>
  <text x="30" y="57" font-family="Arial, sans-serif" font-size="6">Coordinate origin: top-left; units: millimetres; portrait orientation</text>
  <use href="#fiducial" x="35" y="35"/><use href="#fiducial" x="806" y="35"/><use href="#fiducial" x="35" y="1154"/><use href="#fiducial" x="806" y="1154"/><use href="#fiducial" x="420.5" y="594.5"/>
  <g font-family="Arial, sans-serif" font-size="6" fill="black">
    <text x="24" y="82">(0,0)</text><text x="760" y="82">(841,0)</text><text x="24" y="1128">(0,1189)</text><text x="745" y="1128">(841,1189)</text><text x="430" y="587">CENTER</text>
    <text x="410" y="76" font-size="12" font-weight="bold">TOP ↑</text>
  </g>
  <g transform="translate(45 95)">
    <text x="0" y="-8" font-family="Arial, sans-serif" font-size="7">GRAYSCALE PATCHES</text>
    <rect x="0" y="0" width="35" height="25" fill="#000"/><rect x="35" y="0" width="35" height="25" fill="#333"/><rect x="70" y="0" width="35" height="25" fill="#666"/><rect x="105" y="0" width="35" height="25" fill="#999"/><rect x="140" y="0" width="35" height="25" fill="#ccc"/><rect x="175" y="0" width="35" height="25" fill="#fff" stroke="#000" stroke-width="0.4"/>
  </g>
  <g transform="translate(585 95)">
    <text x="0" y="-8" font-family="Arial, sans-serif" font-size="7">COLOUR PATCHES</text>
    <rect x="0" y="0" width="30" height="25" fill="#e31a1c"/><rect x="30" y="0" width="30" height="25" fill="#33a02c"/><rect x="60" y="0" width="30" height="25" fill="#1f78b4"/><rect x="90" y="0" width="30" height="25" fill="#ffdf00"/><rect x="120" y="0" width="30" height="25" fill="#ff7f00"/><rect x="150" y="0" width="30" height="25" fill="#6a3d9a"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="5" fill="#333">
    <text x="25" y="300">Y=300</text><text x="25" y="600">Y=600</text><text x="25" y="900">Y=900</text><text x="200" y="1160">X=200</text><text x="400" y="1160">X=400</text><text x="600" y="1160">X=600</text>
  </g>
</svg>
